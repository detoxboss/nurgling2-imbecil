name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without leading v (e.g. 1.0.0 or 1.0.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    outputs:
      version: ${{ steps.validate.outputs.version }}
      sha: ${{ steps.rev.outputs.sha }}

    steps:
      - name: Validate version input
        id: validate
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::invalid version '$VERSION_INPUT' — expected e.g. 1.0.0 or 1.0.0-beta.1 (no leading v, no whitespace/slashes/shell characters)"
            exit 1
          fi
          echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Resolve commit SHA
        id: rev
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        shell: bash
        run: ant test

      - name: Build portable client (ant bin)
        shell: bash
        run: |
          set -euo pipefail
          ant bin 2>&1 | tee ant-bin.log
          if grep -qE "Error loading file|Invalid number of decoded files for image" ant-bin.log; then
            echo "::error::ant bin output contains resource-conversion errors (see ant-bin.log)"
            exit 1
          fi

      - name: Verify bin/ output
        shell: bash
        run: |
          set -euo pipefail
          required=(
            bin/hafen.jar
            bin/hafen-res.jar
            bin/builtin-res.jar
            bin/nurgling-res.jar
            bin/haven-config.properties
            bin/jogl-all.jar
            bin/gluegen-rt.jar
            bin/jogl-all-natives-windows-amd64.jar
            bin/jogl-all-natives-linux-amd64.jar
            bin/jogl-all-natives-macosx-universal.jar
            bin/gluegen-rt-natives-windows-amd64.jar
            bin/gluegen-rt-natives-linux-amd64.jar
            bin/gluegen-rt-natives-macosx-universal.jar
            bin/lwjgl-fat.jar
            bin/lwjgl-awt.jar
            bin/lwjgl-opengl-fat.jar
            bin/steamworks4j.jar
            bin/steamworks4j-natives-windows-amd64.jar
            bin/steamworks4j-natives-linux-amd64.jar
            bin/steamworks4j-natives-macosx-universal.jar
            bin/json-java.jar
            bin/postgresql-42.7.5.jar
            bin/sqlite-jdbc-3.49.1.0.jar
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file $f"
              exit 1
            fi
          done

      - name: Verify nurgling-res.jar resource integrity
        shell: bash
        run: |
          set -euo pipefail
          entry="res/nurgling/hud/loginscr2.res"
          line="$(jar tvf bin/nurgling-res.jar | awk -v e="$entry" '$NF==e')"
          if [ -z "$line" ]; then
            echo "::error::$entry missing from bin/nurgling-res.jar"
            exit 1
          fi
          size="$(echo "$line" | awk '{print $1}')"
          if [ -z "$size" ] || [ "$size" -le 18 ]; then
            echo "::error::$entry uncompressed size is ${size:-0} bytes (must be > 18) — resource likely failed to convert"
            exit 1
          fi
          echo "$entry OK: $size bytes"

      - name: Upload verified bin/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: bin/
          if-no-files-found: error
          retention-days: 1

  package-and-release:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-windows.outputs.sha }}
          persist-credentials: false

      - name: Download verified bin/ artifact
        uses: actions/download-artifact@v5
        with:
          name: bin-windows
          path: bin

      - name: Assemble portable package
        id: assemble
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
          COMMIT: ${{ needs.build-windows.outputs.sha }}
        run: |
          set -euo pipefail
          PKG="nurgling-bufu-${VERSION}"
          rm -rf "$PKG"
          mkdir -p "$PKG"
          find bin -maxdepth 1 -type f -exec cp {} "$PKG"/ \;
          cp etc/release-run.bat "$PKG"/run.bat
          cp etc/release-run.sh "$PKG"/run.sh
          chmod +x "$PKG"/run.sh
          cp COPYING "$PKG"/COPYING
          cp doc/GPL-3 "$PKG"/LICENSE-GPL-3
          cp doc/LGPL-3 "$PKG"/LICENSE-LGPL-3
          sed \
            -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@COMMIT@/${COMMIT}/g" \
            etc/release-readme.md > "$PKG"/README.md

          required=(run.bat run.sh README.md COPYING LICENSE-GPL-3 LICENSE-LGPL-3)
          for f in "${required[@]}"; do
            if [ ! -f "$PKG/$f" ]; then
              echo "::error::missing required assembled file $f"
              exit 1
            fi
          done

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Verify forbidden files are absent
        run: |
          set -euo pipefail
          PKG="${{ steps.assemble.outputs.pkg }}"
          forbidden=(steam_appid.txt run_updater.bat run_updater_stable.bat run_updater_latest.bat nurgling_launcher.jar)
          for f in "${forbidden[@]}"; do
            if find "$PKG" -iname "$f" | grep -q .; then
              echo "::error::forbidden file $f present in package"
              exit 1
            fi
          done

      - name: Create archives
        id: archives
        run: |
          set -euo pipefail
          PKG="${{ steps.assemble.outputs.pkg }}"
          zip -r "${PKG}.zip" "$PKG" >/dev/null
          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.zip" "${PKG}.tar.gz" > SHA256SUMS.txt
          echo "zip=${PKG}.zip" >> "$GITHUB_OUTPUT"
          echo "tar=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          COMMIT: ${{ needs.build-windows.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "${{ steps.archives.outputs.zip }}" \
            "${{ steps.archives.outputs.tar }}" \
            SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${COMMIT}" \
            --title "v${VERSION}" \
            --notes "Built from master @ ${COMMIT}" \
            --draft
